<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Fragmentless</title>
	<link rel="icon" href="assets/fragmentless-blue-reposo.svg" type="image/svg+xml">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<nav class="navbar">
		<div class="navbar__inner">
			<a class="navbar__brand" href="#inicio">
				<img class="navbar__logo" src="assets/fragmentless-blue-horizontal.svg" alt="Fragmentless">
			</a>

			<div class="navbar__links">
				<a href="#inicio">Inicio</a>
				<a href="#clientes">Clientes</a>
				<a href="#licencias">Licencias</a>
			</div>

			<a class="navbar__action" href="#contacto" aria-label="Contacto">
				<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
					<path d="M20.5 11.5a8.5 8.5 0 0 1-12.3 7.6L4 20l1-4a8.5 8.5 0 1 1 15.5-4.5Z" />
					<path d="M8.7 9.8c.25-.6.5-.6.75-.6h.4c.15 0 .35 0 .5.35l.6 1.35c.1.2 0 .45-.1.55l-.4.5c-.1.15-.1.35 0 .5.25.5 1.25 1.6 2.2 1.95.2.1.35 0 .45-.1l.5-.5c.15-.2.35-.2.5-.1l1.3.65c.15.1.25.25.25.45 0 .65-.75 1.3-1.4 1.3-1.45 0-4.15-1.25-5.25-3.7-.4-.9-.4-1.85 0-2.5Z" fill="#ffffff" stroke="none" />
				</svg>
			</a>
		</div>
	</nav>

	<main>
		<section id="inicio" class="scroll-hero" aria-labelledby="gestion-titulo">
			<header class="scroll-hero__word-header" style="--count: 6;">
				<div class="scroll-hero__grid" aria-hidden="true"></div>
				<section class="scroll-hero__word-layout">
					<h1 id="gestion-titulo" class="scroll-hero__lead">Tú puedes</h1>
					<ul class="scroll-hero__words" aria-label="Acciones disponibles">
						<li>registrar.</li>
						<li>activar.</li>
						<li>administrar.</li>
						<li>controlar.</li>
						<li>proteger.</li>
						<li>licenciar.</li>
					</ul>
				</section>
			</header>

			<div class="scroll-hero__surface">
				<section class="scroll-hero__surface-content">
					<p class="scroll-hero__surface-kicker">Sección 2</p>
					<p class="scroll-hero__tagline">Y yo te mostraré cómo<br><a href="#inicio">gestionar tus licencias.</a></p>
				</section>
			</div>
		</section>
	</main>

	<script>
		const scrollHero = document.querySelector('.scroll-hero');
		const lastScrollWord = document.querySelector('.scroll-hero__words li:last-child');
		const scrollSurface = document.querySelector('.scroll-hero__surface');
		let completionFrame = 0;

		function updateScrollCompletion() {
			completionFrame = 0;
			if (!scrollHero || !lastScrollWord) return;

			const lineHeight = parseFloat(getComputedStyle(lastScrollWord).lineHeight);
			const highlightY = window.innerHeight * 0.38;
			const crossedHighlight = lastScrollWord.getBoundingClientRect().top <= highlightY + lineHeight * 0.5;
			scrollHero.classList.toggle('is-complete', crossedHighlight);

			if (scrollSurface) {
				const surfaceStart = scrollSurface.offsetTop;
				const surfaceProgress = Math.min(
					Math.max((window.scrollY + window.innerHeight - surfaceStart) / window.innerHeight, 0),
					1,
				);
				const textProgress = Math.min(Math.max((surfaceProgress - 0.25) / 0.5, 0), 1);
				scrollSurface.style.setProperty('--surface-progress', surfaceProgress);
				scrollSurface.style.setProperty('--surface-text-progress', textProgress);
			}
		}

		window.addEventListener('scroll', () => {
			if (!completionFrame) completionFrame = window.requestAnimationFrame(updateScrollCompletion);
		}, { passive: true });
		window.addEventListener('resize', updateScrollCompletion);
		updateScrollCompletion();
	</script>

</body>
</html>
